<div class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
  <p-card header="Angular 21 Starter" class="max-w-md w-full shadow-lg">
    <div class="flex flex-col items-center gap-6">
      <!-- Lucide Icons -->
      <div class="flex gap-4">
        <svg lucideHeart class="text-red-500"></svg>
        <svg lucideStar class="text-yellow-500"></svg>
        <svg lucideZap class="text-blue-500"></svg>
      </div>

      <!-- NgRx Signal Store Counter -->
      <div class="text-center">
        <p class="text-sm text-gray-500 mb-1">NgRx Signal Store</p>
        <p class="text-5xl font-bold text-gray-800">{{ store.count() }}</p>
        <p class="text-sm text-gray-400">Double: {{ store.doubleCount() }}</p>
      </div>

      <!-- PrimeNG Buttons + Tailwind -->
      <div class="flex gap-3">
        <p-button label="-1" (onClick)="store.decrement()" severity="danger" size="small" />
        <p-button label="Reset" (onClick)="store.reset()" severity="secondary" size="small" />
        <p-button label="+1" (onClick)="store.increment()" severity="success" size="small" />
      </div>

      <!-- Tailwind CSS demo -->
      <div
        class="mt-4 p-4 rounded-lg bg-gradient-to-r from-indigo-500 to-purple-500 text-white text-center w-full"
      >
        <p class="font-semibold">Tailwind CSS is working!</p>
        <p class="text-sm opacity-80">PrimeNG + Lucide + NgRx Signal Store</p>
      </div>
    </div>
  </p-card>
</div>
