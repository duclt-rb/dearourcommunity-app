<div class="page-section">
  @if (loading()) {
    <div class="loading-state">
      <div class="spinner"></div>
      <p>{{ 'profile.shell.loading' | transloco }}</p>
    </div>
  } @else {
    <div class="page-inner">
      <!-- Left Column: Sidebar Navigation -->
      <app-profile-sidebar />

      <!-- Right Column: Main Tab Contents (Routed Child Components) -->
      <main class="main-content">
        <router-outlet />
      </main>
    </div>
  }
</div>
