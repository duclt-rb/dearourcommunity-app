<div class="system-page">
  <!-- Top Navigation Bar -->
  <header class="system-navbar">
    <div class="navbar-brand">
      <div class="brand-logo-glow"></div>
      <span class="navbar-logo-text">DEAR OUR COMMUNITY</span>
      <span class="navbar-badge">TRANG QUẢN TRỊ</span>
    </div>
    <a routerLink="/profile/dashboard" class="btn-back">
      <svg lucideArrowLeft [size]="16" strokeWidth="2"></svg>
      Quay lại Trang cá nhân
    </a>
  </header>

  <div class="system-page-container">
    <div class="profile-page-header">
      <h1 class="profile-page-title">Quản lý hệ thống</h1>
      <p class="profile-page-subtitle">
        Cấu hình danh sách các gói học phí, khóa học chỉ định và giám sát lịch sử giao dịch qua cổng
        thanh toán.
      </p>

      <!-- Sub-navigation tabs (Packages & Transactions) -->
      <div class="system-main-tabs">
        @if (showPackagesTab) {
          <a class="system-main-tab" routerLink="packages" routerLinkActive="active">
            Quản lý gói học
          </a>
        }
        <a class="system-main-tab" routerLink="transactions" routerLinkActive="active">
          Lịch sử giao dịch
        </a>
        <a class="system-main-tab" routerLink="mentor-bookings" routerLinkActive="active">
          Đặt lịch Mentor
        </a>
        <a class="system-main-tab" routerLink="mentors" routerLinkActive="active">
          Quản lý Mentor
        </a>
      </div>
    </div>

    <!-- Child components outlet -->
    <router-outlet></router-outlet>
  </div>
</div>
