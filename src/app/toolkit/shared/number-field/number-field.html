<label class="number-field">
  @if (label()) {
    <span class="number-field__label">{{ label() }}</span>
  }
  <p-inputnumber
    [ngModel]="value()"
    (ngModelChange)="value.set($event)"
    mode="decimal"
    locale="vi-VN"
    [useGrouping]="true"
    [maxFractionDigits]="maxFractionDigits()"
    [suffix]="currency() ? ' VNĐ' : suffix()"
    [placeholder]="placeholder()"
    [fluid]="true"
    styleClass="number-field__control"
    inputStyleClass="number-field__input"
  />
  @if (hint()) {
    <span class="number-field__hint">{{ hint() }}</span>
  }
</label>
