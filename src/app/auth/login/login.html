<div class="auth-page">
  <!-- Left visual panel -->
  <div class="auth-visual">
    <div class="visual-grain"></div>
    <div class="visual-content">
      <div class="brand-mark">
        <img src="/logo.png" alt="Dear Our Community" class="brand-logo" />
      </div>
      <h1 class="visual-title">Dear Our<br />Community</h1>
      <p class="visual-subtitle">Where stories find their voice and people find their place.</p>
      <div class="visual-decor">
        <div class="decor-line"></div>
        <div class="decor-dots">
          @for (i of [1, 2, 3, 4, 5]; track i) {
            <span class="dot"></span>
          }
        </div>
      </div>
    </div>
    <div class="visual-footer">
      <span class="footer-tagline">Built with intention.</span>
    </div>
  </div>

  <!-- Right form panel -->
  <div class="auth-form-panel">
    <div class="form-wrapper">
      <div class="form-header">
        <h2 class="form-title">Welcome back</h2>
        <p class="form-desc">
          Don't have an account?
          <a routerLink="/auth/register" class="form-link">Create one</a>
        </p>
      </div>

      <form class="auth-form" (ngSubmit)="onSubmit()">
        <div class="field">
          <label for="email" class="field-label">Email</label>
          <div class="input-wrapper">
            <svg lucideMail class="input-icon" />
            <input
              id="email"
              type="email"
              pInputText
              placeholder="you@example.com"
              [(ngModel)]="email"
              name="email"
              class="auth-input"
            />
          </div>
        </div>

        <div class="field">
          <label for="password" class="field-label">Password</label>
          <div class="input-wrapper">
            <svg lucideLock class="input-icon" />
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              pInputText
              placeholder="Enter your password"
              [(ngModel)]="password"
              name="password"
              class="auth-input"
            />
            <button type="button" class="toggle-pass" (click)="showPassword = !showPassword">
              @if (showPassword) {
                <svg lucideEyeOff class="toggle-icon" />
              } @else {
                <svg lucideEye class="toggle-icon" />
              }
            </button>
          </div>
        </div>

        <div class="field-row">
          <label class="checkbox-label">
            <p-checkbox [(ngModel)]="rememberMe" name="remember" [binary]="true" />
            <span>Remember me</span>
          </label>
          <a class="form-link text-sm">Forgot password?</a>
        </div>

        <p-button label="Sign in" type="submit" styleClass="auth-btn" [loading]="loading" />
      </form>

      <div class="divider">
        <span>or continue with</span>
      </div>

      <div class="social-row">
        <button class="social-btn" type="button">
          <svg viewBox="0 0 24 24" class="social-icon">
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"
              fill="#4285F4"
            />
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853"
            />
            <path
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
              fill="#FBBC05"
            />
            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              fill="#EA4335"
            />
          </svg>
          <span>Google</span>
        </button>
        <button class="social-btn" type="button">
          <svg viewBox="0 0 24 24" class="social-icon" fill="currentColor">
            <path
              d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"
            />
          </svg>
          <span>GitHub</span>
        </button>
      </div>
    </div>
  </div>
</div>
